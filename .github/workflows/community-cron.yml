name: Community cron (hourly)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/community
        run: |
          curl -sf -X GET "https://barriored.co/api/cron/community" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
